<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>
		
	</title>
</head>
<body>


<script>
/**
 * 获取网站访问来源
 * @returns {Object} 包含来源URL、来源类型、域名等信息
 */
function getPageReferrer() {
  const referrer = document.referrer;
  let referrerType = 'unknown';
  let referrerDomain = '';

  // 无来源的情况
  if (!referrer) {
    referrerType = 'direct'; // 直接访问（地址栏/书签等）
  } else {
    try {
      // 解析来源URL的域名
      const referrerUrl = new URL(referrer);
      referrerDomain = referrerUrl.hostname;

      // 判断来源类型
      const currentDomain = window.location.hostname;
      if (referrerDomain === currentDomain) {
        referrerType = 'internal'; // 站内跳转
      } else {
        referrerType = 'external'; // 外部链接跳转
      }
    } catch (e) {
      // 解析URL失败（极少数异常情况）
      referrerType = 'invalid';
    }
  }

  return {
    fullReferrer: referrer, // 完整来源URL（空则为直接访问）
    type: referrerType,     // 来源类型：direct/internal/external/invalid/unknown
    domain: referrerDomain  // 来源域名（无则为空）
  };
}

// 新增：将来源信息渲染到页面的函数
function renderReferrerInfoToPage() {
  const referrerInfo = getPageReferrer();
  
  // 创建容器元素
  const infoContainer = document.createElement('div');
  // 设置样式（固定在页面底部，方便查看，不影响页面布局）
  infoContainer.style.cssText = `
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #333;
    z-index: 9999; /* 确保显示在最上层 */
    max-width: 400px;
  `;

  // 构建信息内容（格式化展示）
  const infoContent = `
    <h4 style="margin: 0 0 12px 0; color: #1f2937;">页面访问来源信息</h4>
    <div style="margin-bottom: 8px;">
      <span style="color: #666; display: inline-block; width: 100px;">完整来源URL：</span>
      <span style="color: #0066cc;">${referrerInfo.fullReferrer || '（直接访问/无来源）'}</span>
    </div>
    <div style="margin-bottom: 8px;">
      <span style="color: #666; display: inline-block; width: 100px;">来源类型：</span>
      <span>${getTypeDesc(referrerInfo.type)}</span>
    </div>
    <div>
      <span style="color: #666; display: inline-block; width: 100px;">来源域名：</span>
      <span style="color: #0066cc;">${referrerInfo.domain || '（无）'}</span>
    </div>
  `;

  // 插入内容到容器
  infoContainer.innerHTML = infoContent;
  // 将容器添加到页面body
  document.body.appendChild(infoContainer);
}

// 辅助函数：给来源类型添加中文说明
function getTypeDesc(type) {
  const descMap = {
    direct: '直接访问（地址栏/书签/隐私模式等）',
    internal: '站内跳转（同域名下页面跳转）',
    external: '外部链接跳转（其他网站跳转）',
    invalid: '无效来源（URL解析失败）',
    unknown: '未知来源'
  };
  return descMap[type] || type;
}

// 执行渲染（页面加载完成后执行）
window.addEventListener('load', function() {
  renderReferrerInfoToPage();
});
</script>
</body>
</html>
