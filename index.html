<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器指纹识别</title>
    <script src="https://openfpcdn.io/fingerprintjs/v3/iife.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .fingerprint {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
        }
        button {
            background: #4a6ee0;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #3a5ecf;
        }
    </style>
</head>
<body>
    <h1>浏览器指纹识别</h1>
    <p>您的浏览器指纹ID：</p>
    <div id="fingerprintResult" class="fingerprint">
        正在生成指纹...
    </div>
    <button id="copyBtn">复制指纹ID</button>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // 初始化指纹库
                const fp = await FingerprintJS.load();
                
                // 获取指纹结果
                const result = await fp.get();
                
                // 显示指纹ID
                document.getElementById('fingerprintResult').textContent = result.visitorId;
                
                // 复制功能
                document.getElementById('copyBtn').addEventListener('click', function() {
                    navigator.clipboard.writeText(result.visitorId)
                        .then(() => alert('指纹ID已复制到剪贴板'))
                        .catch(err => console.error('复制失败:', err));
                });
            } catch (error) {
                document.getElementById('fingerprintResult').textContent = '指纹生成失败: ' + error.message;
            }
        });
    </script>
</body>
</html>
